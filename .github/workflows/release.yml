name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to PyPI (e.g. v0.1.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag, package, spec and SELinux module versions agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "tag $TAG is not vMAJOR.MINOR.PATCH; we don't publish prereleases" >&2
            exit 1
          fi
          pkg=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/sentry_v2/__init__.py | tr -d '[:space:]')
          spec=$(sed -n 's/^%global upstream_version//p' packaging/sentry-v2.spec | tr -d '[:space:]')
          sel=$(sed -n 's/^policy_module(sentry_v2, *\([^)]*\))/\1/p' packaging/selinux/sentry_v2.te | tr -d '[:space:]')
          if [ "$TAG" != "v$pkg" ] || [ "$pkg" != "$spec" ] || [ "$pkg" != "$sel" ]; then
            echo "tag $TAG, __version__ $pkg, spec $spec, SELinux module $sel: these must all agree" >&2
            exit 1
          fi
      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [ -f CHANGELOG.md ] || { echo "CHANGELOG.md is missing" >&2; exit 1; }
          awk -v v="${TAG#v}" '
            /^## \[/ { if (on) exit; on = (index($0, "## [" v "]") == 1); next }
            on && /^\[[^]]+\]:[[:space:]]/ { next }
            on
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "No notes under '## [${TAG#v}]' in CHANGELOG.md" >&2; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          if-no-files-found: error
  rpm:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:10
    permissions:
      contents: read
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install dnf-plugins-core rpm-build make bzip2 tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rpmbuild is already here, so make rpm builds in place. It runs
      # `dnf builddep` (CRB enabled) on the SRPM, so the spec is the only
      # list of build dependencies.
      - run: make rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm
          path: |
            rpmbuild/RPMS/**/*.rpm
            rpmbuild/SRPMS/*.rpm
          if-no-files-found: error

  python:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements/release.txt
      - run: python -m build
      - run: twine check dist/*
      - name: Check the built files carry the tag version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=${TAG#v}
          [ "$(find dist -type f -printf '%f\n' | sort)" = "$(printf 'sentry_v2-%s-py3-none-any.whl\nsentry_v2-%s.tar.gz\n' "$v" "$v")" ] \
            || { echo "unexpected files in dist/ for $v:" >&2; ls dist >&2; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python
          path: dist/*
          if-no-files-found: error

  release:
    needs: [rpm, python]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Collect files and write SHA256SUMS
        run: |
          mkdir release
          find artifacts -type f ! -path 'artifacts/notes/*' -exec cp {} release/ \;
          (cd release && sha256sum -- * > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: release/*
          create-storage-record: false
      # The same Sigstore bundle gh attestation verify fetches, shipped as an
      # asset so it can be checked offline (--bundle) and found by Scorecard.
      - name: Attach the provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: jq -c . "$BUNDLE" > "release/sentry-v2-${TAG#v}.intoto.jsonl"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --title "$TAG" --notes-file artifacts/notes/notes.md

  # Runs once PyPI's trusted publisher is set up for this repository and the
  # repository variable PYPI_PUBLISH is "true"; until then the wheel and
  # sdist ship only on the GitHub release.
  pypi:
    needs: release
    if: github.event_name == 'push' && github.repository == 'jamesconwaydev/sentry-v2' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # Manual backfill: publish the wheel and sdist of an existing GitHub release.
  # Running it is the explicit act, so it is not gated on PYPI_PUBLISH.
  pypi-existing:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'jamesconwaydev/sentry-v2'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download and verify the release's Python files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag $TAG is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          gh release download "$TAG" -p '*.whl' -p '*.tar.gz' -p SHA256SUMS -D dist -R "$GITHUB_REPOSITORY"
          cd dist
          sha256sum -c SHA256SUMS --ignore-missing
          v=${TAG#v}
          [ "$(find . -type f -printf '%f\n' | grep -v '^SHA256SUMS$' | sort)" = "$(printf 'sentry_v2-%s-py3-none-any.whl\nsentry_v2-%s.tar.gz\n' "$v" "$v")" ] \
            || { echo "expected exactly one wheel and one sdist for $v:" >&2; ls >&2; exit 1; }
          rm SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
