name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    # Every commit in a pull request carries a Signed-off-by line (CONTRIBUTING.md).
    # Dependabot's commits are exempt.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            [ "$(git log -1 --format=%an "$c")" = "dependabot[bot]" ] && continue
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::$(git log -1 --format='%h %s' "$c") has no Signed-off-by line; see CONTRIBUTING.md"
              missing=1
            fi
          done
          exit "$missing"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements/dev.txt
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements/dev.txt
      - run: pip install --no-deps -e .
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:10
    steps:
      - name: Install distro Python and bindings
        run: dnf install -y python3 python3-pip python3-systemd python3-dbus git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create venv that sees the distro bindings
        run: python3 -m venv --system-site-packages .venv
      - run: .venv/bin/pip install --require-hashes -r requirements/dev.txt
      - run: .venv/bin/pip install --no-deps -e .
      - run: .venv/bin/pytest --cov --cov-report=term-missing
