version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directories: [/, /requirements]
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: "chore"
