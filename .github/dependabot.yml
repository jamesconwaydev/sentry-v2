version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: "ci"
    groups:
      # Every codeql-action step must run the same version, or analyze fails.
      codeql-action:
        patterns: ["github/codeql-action*"]
  - package-ecosystem: pip
    # The pins live here; scanning / as well opened every bump twice.
    directory: /requirements
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: "chore"
    groups:
      requirements:
        patterns: ["*"]
